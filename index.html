<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Феникс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Unbounded:wght@300;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0b;
    --bg2:      #111114;
    --bg3:      #18181d;
    --border:   #222228;
    --amber:    #f59e0b;
    --amber2:   #d97706;
    --amber-lo: rgba(245,158,11,.08);
    --amber-glow: rgba(245,158,11,.15);
    --red:      #ef4444;
    --green:    #22c55e;
    --blue:     #60a5fa;
    --muted:    #52525b;
    --text:     #e4e4e7;
    --text2:    #a1a1aa;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Unbounded', sans-serif;
    --radius: 8px;
    --sidebar: 280px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; overflow: hidden; }

  /* ── Layout ─────────────────────────────── */
  .app { display: flex; height: 100vh; }

  /* ── Sidebar ─────────────────────────────── */
  .sidebar {
    width: var(--sidebar); min-width: var(--sidebar);
    background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-logo {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo h1 {
    font-family: var(--display); font-size: 15px; font-weight: 700;
    letter-spacing: .05em; color: var(--amber);
  }
  .sidebar-logo p { font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: .1em; }
  .flame { display: inline-block; animation: flicker 2.4s ease-in-out infinite; }
  @keyframes flicker {
    0%,100% { opacity: 1; transform: scaleY(1); }
    40%      { opacity: .75; transform: scaleY(.93) translateY(1px); }
    70%      { opacity: .9; transform: scaleY(1.04) translateY(-1px); }
  }

  /* ── Sidebar tabs ──────────────────────────── */
  .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .sidebar-tab {
    flex: 1; padding: 9px 4px; text-align: center; font-size: 10px;
    letter-spacing: .08em; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; transition: all .2s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: var(--mono); text-transform: uppercase;
  }
  .sidebar-tab.active { color: var(--amber); border-bottom-color: var(--amber); }
  .sidebar-tab:hover:not(.active) { color: var(--text2); }

  .tab-panel { display: none; flex: 1; overflow-y: auto; padding: 14px; flex-direction: column; gap: 10px; }
  .tab-panel.active { display: flex; }
  .tab-panel::-webkit-scrollbar { width: 3px; }
  .tab-panel::-webkit-scrollbar-track { background: transparent; }
  .tab-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Profile tab ──────────────────────────── */
  .profile-field { display: flex; flex-direction: column; gap: 4px; }
  .profile-field label { font-size: 9px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .profile-field .pf-val {
    font-size: 12px; color: var(--text); padding: 6px 8px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: border-color .2s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profile-field .pf-val:hover { border-color: var(--amber); }
  .profile-edit-input {
    width: 100%; background: var(--bg3); border: 1px solid var(--amber);
    border-radius: var(--radius); padding: 6px 8px; color: var(--text);
    font-family: var(--mono); font-size: 12px; outline: none;
  }

  /* ── Memory tab ──────────────────────────── */
  .mem-add { display: flex; gap: 6px; }
  .mem-add input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 8px; color: var(--text);
    font-family: var(--mono); font-size: 12px; outline: none;
    transition: border-color .2s;
  }
  .mem-add input:focus { border-color: var(--amber); }
  .btn-icon {
    background: var(--amber-lo); border: 1px solid var(--amber);
    border-radius: var(--radius); padding: 6px 10px; color: var(--amber);
    cursor: pointer; font-size: 14px; line-height: 1; font-family: var(--mono);
    transition: background .2s;
  }
  .btn-icon:hover { background: var(--amber-glow); }
  .mem-list { display: flex; flex-direction: column; gap: 6px; }
  .mem-item {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 10px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    transition: border-color .2s;
  }
  .mem-item:hover { border-color: var(--muted); }
  .mem-item-text { font-size: 11px; color: var(--text2); line-height: 1.5; flex: 1; }
  .mem-item-ts { font-size: 9px; color: var(--muted); margin-top: 3px; }
  .mem-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; flex-shrink: 0; transition: color .2s; }
  .mem-del:hover { color: var(--red); }
  .mem-empty { font-size: 11px; color: var(--muted); text-align: center; padding: 20px 0; }

  /* ── Settings tab ──────────────────────────── */
  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 11px; color: var(--text2); }
  .toggle {
    width: 36px; height: 20px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px; cursor: pointer; position: relative; transition: background .2s, border-color .2s;
  }
  .toggle.on { background: var(--amber); border-color: var(--amber); }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted); transition: transform .2s, background .2s;
  }
  .toggle.on::after { transform: translateX(16px); background: #fff; }
  .setting-select {
    background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 4px 8px; color: var(--text); font-family: var(--mono); font-size: 11px; outline: none;
  }

  /* ── Main chat area ─────────────────────── */
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .chat-header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg2); flex-shrink: 0;
  }
  .chat-header-left { display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
  .status-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); animation: none; }
  .chat-header h2 { font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: .05em; }
  .header-actions { display: flex; gap: 8px; }
  .btn-sm {
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 5px 12px; color: var(--text2);
    font-family: var(--mono); font-size: 11px; cursor: pointer; transition: all .2s;
    letter-spacing: .05em;
  }
  .btn-sm:hover { border-color: var(--amber); color: var(--amber); }

  /* ── Messages ──────────────────────────── */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; gap: 12px; max-width: 840px; }
  .msg.user { flex-direction: row-reverse; margin-left: auto; }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; font-family: var(--display);
  }
  .msg.user .msg-avatar { background: var(--amber-lo); border: 1px solid var(--amber); color: var(--amber); }
  .msg.agent .msg-avatar { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }

  .msg-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .msg-bubble {
    padding: 10px 14px; border-radius: var(--radius); line-height: 1.65;
    font-size: 13px; word-break: break-word;
  }
  .msg.user .msg-bubble {
    background: var(--amber-lo); border: 1px solid rgba(245,158,11,.2);
    color: var(--text); border-radius: 8px 2px 8px 8px;
  }
  .msg.agent .msg-bubble {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); border-radius: 2px 8px 8px 8px;
  }
  .msg-time { font-size: 10px; color: var(--muted); }
  .msg.user .msg-time { text-align: right; }

  /* ── Thought stream ──────────────────────── */
  .thought-block {
    margin: 4px 0; overflow: hidden;
    transition: max-height .35s ease, opacity .35s ease;
  }
  .thought-block.collapsed { max-height: 0; opacity: 0; pointer-events: none; }
  .thought-block.expanded { max-height: 600px; opacity: 1; }
  .thought-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--muted); cursor: pointer; letter-spacing: .06em;
    background: none; border: none; font-family: var(--mono); padding: 2px 0;
    transition: color .2s;
  }
  .thought-toggle:hover { color: var(--amber); }
  .thought-arrow { transition: transform .3s; display: inline-block; }
  .thought-toggle.open .thought-arrow { transform: rotate(90deg); }
  .thought-lines { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
  .thought-line {
    font-size: 11px; padding: 5px 10px; border-radius: 4px;
    border-left: 2px solid; line-height: 1.5;
  }
  .thought-line.thought { border-color: var(--amber); background: rgba(245,158,11,.05); color: #d4a855; }
  .thought-line.tools   { border-color: var(--blue);  background: rgba(96,165,250,.05);  color: #6fa8dc; }
  .thought-line.wait    { border-color: var(--muted); background: rgba(82,82,91,.08);    color: var(--muted); }
  .thought-line.answer  { border-color: var(--green); background: rgba(34,197,94,.05);   color: #5fb872; }

  /* ── Typing indicator ───────────────────── */
  .typing { display: flex; align-items: center; gap: 5px; padding: 10px 14px; }
  .typing span { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); display: inline-block; animation: blink 1.2s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

  /* ── Welcome screen ─────────────────────── */
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: var(--muted); text-align: center; padding: 40px;
  }
  .welcome-icon { font-size: 40px; line-height: 1; }
  .welcome h3 { font-family: var(--display); font-size: 18px; color: var(--amber); font-weight: 700; }
  .welcome p { font-size: 12px; color: var(--muted); line-height: 1.7; max-width: 360px; }
  .welcome-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
  .chip {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px; font-size: 11px; color: var(--text2);
    cursor: pointer; transition: all .2s; font-family: var(--mono);
  }
  .chip:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-lo); }

  /* ── Input area ─────────────────────────── */
  .input-area {
    padding: 14px 20px 18px; border-top: 1px solid var(--border);
    background: var(--bg2); flex-shrink: 0;
  }
  .input-wrap {
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 8px 8px 14px; transition: border-color .2s;
  }
  .input-wrap:focus-within { border-color: var(--amber); }
  #msg-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--mono); font-size: 13px;
    resize: none; line-height: 1.55; max-height: 140px; min-height: 22px;
    scrollbar-width: none;
  }
  #msg-input::placeholder { color: var(--muted); }
  #msg-input::-webkit-scrollbar { display: none; }
  .send-btn {
    background: var(--amber); border: none; border-radius: 6px;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: background .2s, transform .1s;
  }
  .send-btn:hover { background: var(--amber2); }
  .send-btn:active { transform: scale(.93); }
  .send-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }
  .send-btn svg { width: 14px; height: 14px; fill: #000; }

  /* ── Scrollbar global ───────────────────── */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  /* ── Toast ──────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 16px; font-size: 12px; color: var(--text2);
    opacity: 0; transform: translateY(8px); transition: all .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ── Resize handle ──────────────────────── */
  .resize-handle { width: 3px; cursor: col-resize; background: transparent; transition: background .2s; flex-shrink: 0; }
  .resize-handle:hover, .resize-handle.dragging { background: var(--amber); }
</style>
</head>
<body>

<div class="app">
  <!-- ── Sidebar ───────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h1><span class="flame">🔥</span> Феникс</h1>
      <p id="sb-version">v0.5 · локальный агент</p>
    </div>
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="profile">Профиль</button>
      <button class="sidebar-tab" data-tab="memory">Память</button>
      <button class="sidebar-tab" data-tab="settings">Настройки</button>
    </div>

    <!-- Profile -->
    <div class="tab-panel active" id="tab-profile"></div>

    <!-- Memory -->
    <div class="tab-panel" id="tab-memory">
      <div class="mem-add">
        <input id="mem-input" placeholder="Добавить факт…">
        <button class="btn-icon" id="mem-add-btn" title="Добавить">+</button>
      </div>
      <div class="mem-list" id="mem-list">
        <div class="mem-empty">Загрузка…</div>
      </div>
    </div>

    <!-- Settings -->
    <div class="tab-panel" id="tab-settings">
      <div class="setting-row">
        <span class="setting-label">Поток мыслей</span>
        <div class="toggle on" id="toggle-thoughts" title="Показывать шаги рассуждений"></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Очистить историю</span>
        <button class="btn-sm" id="btn-clear">Очистить</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Экспорт диалога</span>
        <button class="btn-sm" id="btn-export">Скачать</button>
      </div>
    </div>
  </aside>

  <div class="resize-handle" id="resizer"></div>

  <!-- ── Main ──────────────────────────────── -->
  <main class="chat-area">
    <header class="chat-header">
      <div class="chat-header-left">
        <div class="status-dot offline" id="status-dot"></div>
        <h2 id="header-title">Подключение…</h2>
      </div>
      <div class="header-actions">
        <button class="btn-sm" id="btn-header-clear">Новый чат</button>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🔥</div>
        <h3>Феникс</h3>
        <p>Локальный ИИ-агент с долгосрочной памятью,<br>инструментами и многошаговым рассуждением.</p>
        <div class="welcome-chips" id="chips">
          <span class="chip">Напиши скрипт на Python</span>
          <span class="chip">Найди информацию</span>
          <span class="chip">Посчитай выражение</span>
          <span class="chip">Прочитай файл</span>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="msg-input" rows="1" placeholder="Напиши сообщение…"></textarea>
        <button class="send-btn" id="send-btn" disabled>
          <svg viewBox="0 0 16 16"><path d="M2 8l12-6-5 6 5 6z"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8000'
const WS  = 'ws://localhost:8000/ws/chat'

let ws = null
let showThoughts = true
let isTyping    = false
let profileData = {}
let historyExport = []

// ════════════════════════════════════════
//  WebSocket
// ════════════════════════════════════════
function connectWS() {
  ws = new WebSocket(WS)

  ws.onopen = () => {
    setStatus(true)
    document.getElementById('send-btn').disabled = false
  }

  ws.onclose = () => {
    setStatus(false)
    document.getElementById('send-btn').disabled = true
    setTimeout(connectWS, 3000)
  }

  ws.onerror = () => ws.close()

  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data)
    if (msg.event === 'user_echo') return
    if (msg.event === 'thought')   appendThought(msg.text, msg.kind)
    if (msg.event === 'answer')    finalizeAnswer(msg.text, msg.name)
    if (msg.event === 'error')     showToast('Ошибка: ' + msg.text, true)
  }
}

function setStatus(online) {
  const dot = document.getElementById('status-dot')
  const h   = document.getElementById('header-title')
  dot.className = 'status-dot' + (online ? '' : ' offline')
  h.textContent = online
    ? (profileData.name || 'Феникс') + ' — онлайн'
    : 'Нет соединения…'
}

// ════════════════════════════════════════
//  Отправка
// ════════════════════════════════════════
function sendMsg(text) {
  if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) return
  hideWelcome()
  appendUserMsg(text)
  startTyping()
  ws.send(JSON.stringify({ message: text }))
  historyExport.push({ role: 'user', text, ts: now() })
}

// ════════════════════════════════════════
//  Сообщения
// ════════════════════════════════════════
function hideWelcome() {
  const w = document.getElementById('welcome')
  if (w) w.remove()
}

function appendUserMsg(text) {
  const el = makeMsg('user', 'Я', text)
  msgs().appendChild(el)
  scrollBottom()
}

let _agentMsgEl = null
let _thoughtEl  = null

function startTyping() {
  isTyping = true
  _thoughtEl  = null
  _agentMsgEl = null
  const wrap = document.createElement('div')
  wrap.className = 'msg agent'
  wrap.id = 'typing-wrap'
  wrap.innerHTML = `
    <div class="msg-avatar">${(profileData.name||'Ф')[0]}</div>
    <div class="msg-body">
      <div class="thought-block" id="live-thoughts" style="display:none">
        <button class="thought-toggle open" id="live-toggle">
          <span class="thought-arrow">▶</span> мысли
        </button>
        <div class="thought-lines" id="live-lines"></div>
      </div>
      <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>`
  msgs().appendChild(wrap)
  scrollBottom()

  document.getElementById('live-toggle')?.addEventListener('click', function() {
    const block = document.getElementById('live-thoughts')
    const open  = block.classList.contains('expanded')
    block.classList.toggle('collapsed', open)
    block.classList.toggle('expanded', !open)
    this.classList.toggle('open', !open)
  })
}

function appendThought(text, kind) {
  if (!isTyping) return
  const linesEl  = document.getElementById('live-lines')
  const blockEl  = document.getElementById('live-thoughts')
  if (!linesEl || !blockEl) return

  blockEl.style.display = ''
  blockEl.classList.remove('collapsed')
  blockEl.classList.add('expanded')

  if (!showThoughts) {
    blockEl.classList.remove('expanded')
    blockEl.classList.add('collapsed')
  }

  const line = document.createElement('div')
  line.className = 'thought-line ' + (kind || 'wait')
  line.textContent = text
  linesEl.appendChild(line)
  scrollBottom()
}

function finalizeAnswer(text, agentName) {
  isTyping = false
  const wrap = document.getElementById('typing-wrap')
  if (!wrap) return
  wrap.removeAttribute('id')

  const bubble = wrap.querySelector('.msg-bubble')
  bubble.innerHTML = formatText(text)

  const body  = wrap.querySelector('.msg-body')
  const time  = document.createElement('div')
  time.className = 'msg-time'
  time.textContent = now()
  body.appendChild(time)

  scrollBottom()
  loadMemory()
  historyExport.push({ role: 'agent', text, ts: now() })
}

function makeMsg(role, label, text) {
  const wrap = document.createElement('div')
  wrap.className = `msg ${role}`
  wrap.innerHTML = `
    <div class="msg-avatar">${label[0]}</div>
    <div class="msg-body">
      <div class="msg-bubble">${formatText(text)}</div>
      <div class="msg-time">${now()}</div>
    </div>`
  return wrap
}

function formatText(t) {
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code style="background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px">$1</code>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>')
}

function msgs() { return document.getElementById('messages') }
function scrollBottom() {
  const m = msgs()
  requestAnimationFrame(() => m.scrollTop = m.scrollHeight)
}
function now() { return new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}) }

// ════════════════════════════════════════
//  Профиль
// ════════════════════════════════════════
const PROFILE_FIELDS = [
  ['name','Имя'],['version','Версия'],['description','Описание'],
  ['author','Автор'],['language','Язык'],['personality','Характер'],
  ['skills','Умения'],['motto','Девиз'],
]

async function loadProfile() {
  const r = await fetch(API + '/api/profile').catch(() => null)
  if (!r?.ok) return
  profileData = await r.json()
  renderProfile()
  setStatus(true)
  document.getElementById('sb-version').textContent =
    `v${profileData.version||'?'} · локальный агент`
}

function renderProfile() {
  const panel = document.getElementById('tab-profile')
  panel.innerHTML = ''
  for (const [key, label] of PROFILE_FIELDS) {
    const val = profileData[key] || '—'
    const field = document.createElement('div')
    field.className = 'profile-field'
    field.innerHTML = `<label>${label}</label>
      <div class="pf-val" data-key="${key}" title="Нажми для редактирования">${escHtml(val)}</div>`
    panel.appendChild(field)
  }
  panel.querySelectorAll('.pf-val').forEach(el => {
    el.addEventListener('click', () => editProfileField(el))
  })
}

function editProfileField(el) {
  const key = el.dataset.key
  const cur = profileData[key] || ''
  const inp = document.createElement('input')
  inp.className = 'profile-edit-input'
  inp.value = cur
  el.replaceWith(inp)
  inp.focus()
  inp.select()
  const save = async () => {
    const nv = inp.value.trim()
    if (nv && nv !== cur) {
      profileData[key] = nv
      await fetch(API + '/api/profile', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ [key]: nv }),
      })
      showToast(`${key} обновлено`)
      if (key === 'name') setStatus(true)
    }
    renderProfile()
  }
  inp.addEventListener('blur', save)
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = cur; renderProfile() } })
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

// ════════════════════════════════════════
//  Память
// ════════════════════════════════════════
async function loadMemory() {
  const r = await fetch(API + '/api/memory').catch(() => null)
  if (!r?.ok) return
  const list = await r.json()
  const el   = document.getElementById('mem-list')
  if (!list.length) { el.innerHTML = '<div class="mem-empty">Память пуста</div>'; return }
  el.innerHTML = ''
  list.forEach(item => {
    const div = document.createElement('div')
    div.className = 'mem-item'
    div.innerHTML = `
      <div>
        <div class="mem-item-text">${escHtml(item.text)}</div>
        <div class="mem-item-ts">${item.ts}</div>
      </div>
      <button class="mem-del" data-idx="${item.idx}" title="Удалить">×</button>`
    el.appendChild(div)
  })
  el.querySelectorAll('.mem-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      await fetch(`${API}/api/memory/${btn.dataset.idx}`, { method: 'DELETE' })
      loadMemory()
    })
  })
}

document.getElementById('mem-add-btn').addEventListener('click', async () => {
  const inp = document.getElementById('mem-input')
  const txt = inp.value.trim()
  if (!txt) return
  await fetch(API + '/api/memory', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ text: txt }),
  })
  inp.value = ''
  loadMemory()
  showToast('Запомнено')
})
document.getElementById('mem-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('mem-add-btn').click()
})

// ════════════════════════════════════════
//  Настройки
// ════════════════════════════════════════
document.getElementById('toggle-thoughts').addEventListener('click', async function() {
  showThoughts = !showThoughts
  this.classList.toggle('on', showThoughts)
  await fetch(API + '/api/thoughts_mode', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ enabled: showThoughts }),
  })
  showToast('Поток мыслей: ' + (showThoughts ? 'включён' : 'скрыт'))
})

document.getElementById('btn-clear').addEventListener('click', async () => {
  await fetch(API + '/api/clear', { method: 'POST' })
  msgs().innerHTML = ''
  historyExport = []
  showToast('История очищена')
})

document.getElementById('btn-header-clear').addEventListener('click', () => {
  document.getElementById('btn-clear').click()
})

document.getElementById('btn-export').addEventListener('click', () => {
  const lines = historyExport.map(m =>
    `**[${m.ts}] ${m.role === 'user' ? 'Ты' : (profileData.name||'Феникс')}:** ${m.text}`
  ).join('\n\n')
  const blob = new Blob([`# Экспорт диалога — Феникс\n\n${lines}`], { type: 'text/markdown' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `phoenix_${Date.now()}.md`
  a.click()
})

// ════════════════════════════════════════
//  Tabs
// ════════════════════════════════════════
document.querySelectorAll('.sidebar-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sidebar-tab').forEach(b => b.classList.remove('active'))
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'))
    btn.classList.add('active')
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active')
    if (btn.dataset.tab === 'memory') loadMemory()
  })
})

// ════════════════════════════════════════
//  Chips (подсказки)
// ════════════════════════════════════════
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    const inp = document.getElementById('msg-input')
    inp.value = c.textContent
    inp.focus()
    autoResize(inp)
  })
})

// ════════════════════════════════════════
//  Input
// ════════════════════════════════════════
const inputEl  = document.getElementById('msg-input')
const sendBtn  = document.getElementById('send-btn')

function autoResize(el) {
  el.style.height = 'auto'
  el.style.height = Math.min(el.scrollHeight, 140) + 'px'
}

inputEl.addEventListener('input', () => autoResize(inputEl))
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    doSend()
  }
})
sendBtn.addEventListener('click', doSend)

function doSend() {
  const txt = inputEl.value.trim()
  if (!txt || isTyping) return
  inputEl.value = ''
  autoResize(inputEl)
  sendMsg(txt)
}

// ════════════════════════════════════════
//  Resize sidebar
// ════════════════════════════════════════
const resizer  = document.getElementById('resizer')
const sidebar  = document.getElementById('sidebar')
let resizerDragging = false, resizerStartX = 0, resizerStartW = 0

resizer.addEventListener('mousedown', e => {
  resizerDragging = true
  resizerStartX   = e.clientX
  resizerStartW   = sidebar.offsetWidth
  resizer.classList.add('dragging')
  document.body.style.userSelect = 'none'
})
document.addEventListener('mousemove', e => {
  if (!resizerDragging) return
  const w = Math.max(200, Math.min(400, resizerStartW + e.clientX - resizerStartX))
  sidebar.style.width = w + 'px'
  sidebar.style.minWidth = w + 'px'
})
document.addEventListener('mouseup', () => {
  resizerDragging = false
  resizer.classList.remove('dragging')
  document.body.style.userSelect = ''
})

// ════════════════════════════════════════
//  Toast
// ════════════════════════════════════════
let toastTimer = null
function showToast(msg, err = false) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.style.borderColor = err ? 'var(--red)' : 'var(--border)'
  t.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500)
}

// ════════════════════════════════════════
//  Init
// ════════════════════════════════════════
loadProfile().then(() => { connectWS(); loadMemory() })
</script>
